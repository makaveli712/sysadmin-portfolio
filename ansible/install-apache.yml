---
- hosts: ned3@192.168.1.15
  vars:
    ansible_become_exe: /usr/bin/sudo.ws
  become: true
  
  tasks:
    - name: install apache2 package
      apt:
        name: apache2
        state: latest
        update_cache: yes # Best practice for apt module

    - name: add php support for apache
      apt:
        name: libapache2-mod-php
        state: latest
