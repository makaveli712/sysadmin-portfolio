- name: Deploy web server
  hosts: web_servers
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Deploy index page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Testing Web Server</h1>
        mode: "0644"

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
        
